<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::div}, ~{::title})}">
<head>
    <title>決勝トーナメント | ASOPokeTool</title>
</head>
<body>
    <div>
        <a th:href="@{/tournament/{id}(id=${tournament.id})}" class="btn btn-outline-light btn-sm mb-4"><i class="fa-solid fa-arrow-left"></i> 大会詳細に戻る</a>

        <div id="tournamentBracketMeta" 
             th:data-tournament-id="${tournament.id}"
             th:data-tournament-name="${tournament.name}" 
             th:data-icon-path="${tournament.iconPath}" 
             th:data-held-date="${tournament.heldDate}" 
             th:data-venue="${tournament.venue}" 
             style="display:none;"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 text-white flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1" th:text="${tournament.name} + ' - 決勝トーナメント'">決勝トーナメント</h2>
                <p class="text-muted mb-0">スイスドローの結果をもとに編成された決勝トーナメントです。</p>
            </div>
            <div th:unless="${#lists.isEmpty(brackets)}">
                <button class="btn btn-success btn-sm" onclick="captureAllBrackets()">
                    <i class="fa-solid fa-camera"></i> 📸 全グループを一括画像保存
                </button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(brackets)}" class="card-glass p-5 text-center text-muted text-white">
            <i class="fa-solid fa-sitemap fa-3x mb-3 text-warning"></i>
            <h4 class="fw-bold text-white">トーナメント未編成</h4>
            <p class="mb-0">管理者がトーナメント表を編成するまでお待ちください。</p>
        </div>

        <div th:unless="${#lists.isEmpty(brackets)}">
            <style>
                /* Custom styling for bracket tab buttons */
                #bracketTab .nav-link {
                    color: #4A3E3D !important;
                    font-weight: 600;
                    background: rgba(255, 255, 255, 0.9);
                    border: 2px solid rgba(255, 123, 84, 0.25) !important;
                    transition: all 0.25s ease;
                    border-radius: 12px;
                }
                #bracketTab .nav-link.active {
                    background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%) !important;
                    border-color: transparent !important;
                    box-shadow: 0 4px 15px rgba(255, 107, 53, 0.35);
                    color: #ffffff !important;
                }
                #bracketTab .nav-link:hover:not(.active) {
                    background: #FFF5EE !important;
                    color: #FF6B35 !important;
                    border-color: #FF6B35 !important;
                }
            </style>
            <!-- Bracket Tabs -->
            <ul class="nav nav-pills mb-4" id="bracketTab" role="tablist">
                <li class="nav-item" th:each="b, iter : ${brackets}" role="presentation">
                    <button class="nav-link px-4 py-2 me-2" th:classappend="${iter.first ? 'active' : ''}" 
                            th:id="'tab-' + ${b.id}" data-bs-toggle="tab" th:data-bs-target="'#panel-' + ${b.id}" 
                            type="button" role="tab" th:aria-controls="'panel-' + ${b.id}" th:aria-selected="${iter.first}" 
                            th:text="${b.groupName}">グループA</button>
                </li>
            </ul>

            <!-- Tab Content (Tournament tree view) -->
            <div class="tab-content" id="bracketTabContent">
                <div class="tab-pane fade" th:each="b, iter : ${brackets}" th:classappend="${iter.first ? 'show active' : ''}" 
                     th:id="'panel-' + ${b.id}" role="tabpanel" th:aria-labelledby="'tab-' + ${b.id}">
                    <div class="card-glass p-4 overflow-auto" th:id="'bracketArea-' + ${b.id}" th:data-group-name="${b.groupName}" style="border-radius: 16px;">
                        <div class="bracket-tree-container" th:data-group-id="${b.id}">
                            
                            <!-- Round 1 (QF / SF depending on size) -->
                            <div th:if="${#lists.size(b.matches.?[roundNumber == 1]) > 0}" class="bracket-round bracket-round-1">
                                <h5 class="bracket-round-title text-center text-muted small border-bottom border-secondary pb-2">1回戦</h5>
                                <div class="bracket-round-matches">
                                    <div th:each="m : ${b.matches}" th:if="${m.roundNumber == 1}" class="bracket-match-box"
                                         th:classappend="(${m.winnerEntryId != null} ? (${m.winnerEntryId == m.player1EntryId} ? 'winner-p1' : 'winner-p2') : '') + ' ' + (${(myEntry != null && (myEntry.id == m.player1EntryId || myEntry.id == m.player2EntryId) && m.player1EntryId != null && m.player2EntryId != null && m.winnerEntryId == null && (isRoundFinishedMap != null && !isRoundFinishedMap.get(m.roundNumber))) ? 'clickable' : ''})"
                                         th:data-match-id="${m.id}"
                                         th:data-round="1"
                                         th:data-match-num="${m.matchNumber}"
                                         th:data-p1-name="${m.isBye && m.player1EntryId == null ? '（不戦勝）' : (m.player1Name != null ? m.player1Name : '（TBD）')}"
                                         th:data-p2-name="${m.isBye && m.player2EntryId == null ? '（不戦勝）' : (m.player2Name != null ? m.player2Name : '（TBD）')}"
                                         th:data-p1-icon="${m.player1IconPath != null ? m.player1IconPath : ''}"
                                         th:data-p2-icon="${m.player2IconPath != null ? m.player2IconPath : ''}"
                                         th:data-winner-id="${m.winnerEntryId}"
                                         th:data-p1-id="${m.player1EntryId}"
                                         th:data-p2-id="${m.player2EntryId}"
                                         th:data-is-bye="${m.isBye}"
                                         onclick="handleBracketClick(this)">
                                        <div class="small text-muted mb-1 text-center font-monospace" th:text="'マッチ ' + ${m.matchNumber}">M1</div>
                                        <div class="bracket-player" th:classappend="${m.winnerEntryId != null && m.winnerEntryId == m.player1EntryId ? 'winner' : ''}">
                                            <span th:text="${m.isBye && m.player1EntryId == null ? '（不戦勝）' : (m.player1Name != null ? m.player1Name : '（TBD）')}">選手A</span>
                                        </div>
                                        <div class="bracket-player" th:classappend="${m.winnerEntryId != null && m.winnerEntryId == m.player2EntryId ? 'winner' : ''}">
                                            <span th:text="${m.isBye && m.player2EntryId == null ? '（不戦勝）' : (m.player2Name != null ? m.player2Name : '（TBD）')}">選手B</span>
                                        </div>
                                        <div class="match-number-badge" th:text="${m.matchNumber}">1</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Round 2 -->
                            <div th:if="${#lists.size(b.matches.?[roundNumber == 2]) > 0}" class="bracket-round bracket-round-2">
                                <h5 class="bracket-round-title text-center text-muted small border-bottom border-secondary pb-2">2回戦</h5>
                                <div class="bracket-round-matches">
                                    <div th:each="m : ${b.matches}" th:if="${m.roundNumber == 2}" class="bracket-match-box"
                                         th:classappend="(${m.winnerEntryId != null} ? (${m.winnerEntryId == m.player1EntryId} ? 'winner-p1' : 'winner-p2') : '') + ' ' + (${(myEntry != null && (myEntry.id == m.player1EntryId || myEntry.id == m.player2EntryId) && m.player1EntryId != null && m.player2EntryId != null && m.winnerEntryId == null && (isRoundFinishedMap != null && !isRoundFinishedMap.get(m.roundNumber))) ? 'clickable' : ''})"
                                         th:data-match-id="${m.id}"
                                         th:data-round="2"
                                         th:data-match-num="${m.matchNumber}"
                                         th:data-p1-name="${m.player1Name != null ? m.player1Name : '（待機中）'}"
                                         th:data-p2-name="${m.player2Name != null ? m.player2Name : '（待機中）'}"
                                         th:data-p1-icon="${m.player1IconPath != null ? m.player1IconPath : ''}"
                                         th:data-p2-icon="${m.player2IconPath != null ? m.player2IconPath : ''}"
                                         th:data-winner-id="${m.winnerEntryId}"
                                         th:data-p1-id="${m.player1EntryId}"
                                         th:data-p2-id="${m.player2EntryId}"
                                         th:data-is-bye="${m.isBye}"
                                         onclick="handleBracketClick(this)">
                                        <div class="small text-muted mb-1 text-center font-monospace" th:text="'マッチ ' + ${m.matchNumber}">M1</div>
                                        <div class="bracket-player" th:classappend="${m.winnerEntryId != null && m.winnerEntryId == m.player1EntryId ? 'winner' : ''}">
                                            <span th:text="${m.player1Name != null ? m.player1Name : '（前ラウンド勝者）'}">選手A</span>
                                        </div>
                                        <div class="bracket-player" th:classappend="${m.winnerEntryId != null && m.winnerEntryId == m.player2EntryId ? 'winner' : ''}">
                                            <span th:text="${m.player2Name != null ? m.player2Name : '（前ラウンド勝者）'}">選手B</span>
                                        </div>
                                        <div class="match-number-badge" th:text="${m.matchNumber + 4}">5</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Round 3 -->
                            <div th:if="${#lists.size(b.matches.?[roundNumber == 3]) > 0}" class="bracket-round bracket-round-3">
                                <h5 class="bracket-round-title text-center text-muted small border-bottom border-secondary pb-2">3回戦</h5>
                                <div class="bracket-round-matches">
                                    <div th:each="m : ${b.matches}" th:if="${m.roundNumber == 3}" class="bracket-match-box bracket-match-box-final"
                                         th:classappend="(${m.winnerEntryId != null} ? (${m.winnerEntryId == m.player1EntryId} ? 'winner-p1' : 'winner-p2') : '') + ' ' + (${(myEntry != null && (myEntry.id == m.player1EntryId || myEntry.id == m.player2EntryId) && m.player1EntryId != null && m.player2EntryId != null && m.winnerEntryId == null && (isRoundFinishedMap != null && !isRoundFinishedMap.get(m.roundNumber))) ? 'clickable' : ''})"
                                         style="border: 1px solid var(--accent); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);"
                                         th:data-match-id="${m.id}"
                                         th:data-round="3"
                                         th:data-match-num="${m.matchNumber}"
                                         th:data-p1-name="${m.player1Name != null ? m.player1Name : '（待機中）'}"
                                         th:data-p2-name="${m.player2Name != null ? m.player2Name : '（待機中）'}"
                                         th:data-p1-icon="${m.player1IconPath != null ? m.player1IconPath : ''}"
                                         th:data-p2-icon="${m.player2IconPath != null ? m.player2IconPath : ''}"
                                         th:data-winner-id="${m.winnerEntryId}"
                                         th:data-p1-id="${m.player1EntryId}"
                                         th:data-p2-id="${m.player2EntryId}"
                                         th:data-is-bye="${m.isBye}"
                                         onclick="handleBracketClick(this)">
                                        <div class="small text-warning mb-1 text-center font-monospace"><i class="fa-solid fa-crown text-warning"></i> 決勝</div>
                                        <div class="bracket-player" th:classappend="${m.winnerEntryId != null && m.winnerEntryId == m.player1EntryId ? 'winner' : ''}">
                                            <span th:text="${m.player1Name != null ? m.player1Name : '（前ラウンド勝者）'}">選手A</span>
                                        </div>
                                        <div class="bracket-player" th:classappend="${m.winnerEntryId != null && m.winnerEntryId == m.player2EntryId ? 'winner' : ''}">
                                            <span th:text="${m.player2Name != null ? m.player2Name : '（前ラウンド勝者）'}">選手B</span>
                                        </div>
                                        <div class="match-number-badge" th:text="7">7</div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        <script>
            async function downloadScreenshot(elementId, filename, groupName) {
                const element = document.getElementById(elementId);
                if (!element) return;
                
                if (!groupName && element) {
                    groupName = element.getAttribute('data-group-name') || '';
                }
                if (!groupName) {
                    const pane = element.closest('.tab-pane');
                    if (pane) {
                        const tabBtn = document.getElementById('tab-' + pane.id.replace('panel-', ''));
                        if (tabBtn) groupName = tabBtn.innerText.trim();
                    }
                }
                if (!groupName) groupName = '';

                // データ属性からマッチ情報を抽出
                const matchBoxes = element.querySelectorAll('.bracket-match-box');
                const matches = [];
                matchBoxes.forEach(box => {
                    matches.push({
                        round: parseInt(box.getAttribute('data-round')),
                        matchNum: parseInt(box.getAttribute('data-match-num')),
                        p1Name: box.getAttribute('data-p1-name') || '',
                        p2Name: box.getAttribute('data-p2-name') || '',
                        winnerId: box.getAttribute('data-winner-id') ? parseInt(box.getAttribute('data-winner-id')) : null,
                        p1Id: box.getAttribute('data-p1-id') ? parseInt(box.getAttribute('data-p1-id')) : null,
                        p2Id: box.getAttribute('data-p2-id') ? parseInt(box.getAttribute('data-p2-id')) : null,
                        isBye: box.getAttribute('data-is-bye') === 'true'
                    });
                });

                if (matches.length === 0) return;

                const round1Matches = matches.filter(m => m.round === 1).sort((a, b) => a.matchNum - b.matchNum);
                const totalRounds = Math.max(...matches.map(m => m.round));
                const totalPlayers = round1Matches.length * 2;

                // 画像読み込みヘルパー
                const loadImage = (src) => new Promise((resolve) => {
                    if (!src || src === 'null' || src.trim() === '') return resolve(null);
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = src;
                });

                const metaElem = document.getElementById('tournamentBracketMeta');
                const tournamentName = metaElem ? (metaElem.getAttribute('data-tournament-name') || '') : '';
                const bannerSrc = metaElem ? (metaElem.getAttribute('data-icon-path') || '') : '';
                const heldDate = metaElem ? (metaElem.getAttribute('data-held-date') || '') : '';
                const venue = metaElem ? (metaElem.getAttribute('data-venue') || '') : '';

                const isGroupA = !groupName || /グループ\s*A|Group\s*A|^A\b/i.test(groupName) || groupName.includes('A') || groupName === 'グループA';

                const [trophyPikachuImg, bannerImg] = await Promise.all([
                    isGroupA ? loadImage('/asopoketool/images/pikachu_trophy.png') : Promise.resolve(null),
                    loadImage(bannerSrc)
                ]);

                // キャンバスを作成
                const canvas = document.createElement('canvas');
                canvas.width = 1040;
                canvas.height = 700;
                const ctx = canvas.getContext('2d');

                // 白背景で塗りつぶし
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 案B: モンスターボールの透かし（ウォーターマーク）
                function drawPokeballWatermark(cx, cy, radius, opacity) {
                    ctx.save();
                    ctx.globalAlpha = opacity;
                    ctx.translate(cx, cy);

                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = radius * 0.07;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(-radius, 0);
                    ctx.lineTo(radius, 0);
                    ctx.lineWidth = radius * 0.07;
                    ctx.strokeStyle = '#64748b';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, radius * 0.28, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = radius * 0.07;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, radius * 0.12, 0, Math.PI * 2);
                    ctx.fillStyle = '#64748b';
                    ctx.fill();

                    ctx.restore();
                }
                drawPokeballWatermark(640, 370, 190, 0.045);

                // ヘッダー背景（バナー画像の薄い表示 またはグラデーション）
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width, 68);
                ctx.clip();

                if (bannerImg) {
                    ctx.globalAlpha = 0.22;
                    const hRatio = 68 / bannerImg.height;
                    const wRatio = canvas.width / bannerImg.width;
                    const ratio = Math.max(hRatio, wRatio);
                    const nw = bannerImg.width * ratio;
                    const nh = bannerImg.height * ratio;
                    ctx.drawImage(bannerImg, (canvas.width - nw) / 2, (68 - nh) / 2, nw, nh);
                } else {
                    ctx.globalAlpha = 0.08;
                    const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
                    grad.addColorStop(0, '#ff6b35');
                    grad.addColorStop(1, '#ff8c42');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, 68);
                }
                ctx.restore();

                function drawLine(x1, y1, x2, y2, color, width) {
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                }

                // 大会名とグループ名（ヘッダー）の描画
                let titleText = tournamentName ? tournamentName + '　決勝トーナメント' : '決勝トーナメント';
                if (groupName) {
                    titleText += ' 【' + groupName + '】';
                }

                ctx.fillStyle = '#1e293b';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let titleFontSize = 22;
                ctx.font = 'bold ' + titleFontSize + 'px "Noto Sans JP", sans-serif';
                while (ctx.measureText(titleText).width > 920 && titleFontSize > 13) {
                    titleFontSize -= 1;
                    ctx.font = 'bold ' + titleFontSize + 'px "Noto Sans JP", sans-serif';
                }
                ctx.fillText(titleText, canvas.width / 2, 35);

                // ヘッダー下部の区切り線
                drawLine(40, 68, canvas.width - 40, 68, '#cbd5e1', 1.5);

                // 座標計算
                const topY = 105;
                const bottomY = 640;
                const availableHeight = bottomY - topY;
                const startX = 220;
                const endX = 730;
                const stepX = (endX - startX) / totalRounds;

                const roundY = {};

                // 1. 各選手のY座標と選手名描画
                ctx.font = 'bold 16px "Noto Sans JP", sans-serif';
                ctx.fillStyle = '#1e293b';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';

                roundY[1] = {};
                for (let i = 0; i < round1Matches.length; i++) {
                    const m = round1Matches[i];
                    const p1Y = topY + (i * 2 + 0.5) * (availableHeight / totalPlayers);
                    const p2Y = topY + (i * 2 + 1.5) * (availableHeight / totalPlayers);
                    const midY = (p1Y + p2Y) / 2;

                    roundY[1][m.matchNum] = { p1Y, p2Y, midY };

                    ctx.fillText(m.p1Name || (m.isBye && !m.p1Id ? '（不戦勝）' : '（TBD）'), startX - 16, p1Y);
                    ctx.fillText(m.p2Name || (m.isBye && !m.p2Id ? '（不戦勝）' : '（TBD）'), startX - 16, p2Y);
                }

                // 2. 次ラウンド以降の Y 座標計算
                for (let r = 2; r <= totalRounds; r++) {
                    roundY[r] = {};
                    const matchesInRound = matches.filter(m => m.round === r);
                    matchesInRound.forEach(m => {
                        const child1 = roundY[r - 1][(m.matchNum - 1) * 2 + 1];
                        const child2 = roundY[r - 1][(m.matchNum - 1) * 2 + 2];
                        if (child1 && child2) {
                            const p1Y = child1.midY;
                            const p2Y = child2.midY;
                            const midY = (p1Y + p2Y) / 2;
                            roundY[r][m.matchNum] = { p1Y, p2Y, midY };
                        }
                    });
                }

                // 3. 基本線（黒線、2px）の描画
                for (let r = 1; r <= totalRounds; r++) {
                    const rStartX = startX + (r - 1) * stepX;
                    const rMidX = rStartX + stepX * 0.55;
                    const rEndX = rStartX + stepX;

                    const matchesInRound = matches.filter(m => m.round === r);
                    matchesInRound.forEach(m => {
                        const coords = roundY[r][m.matchNum];
                        if (!coords) return;

                        drawLine(rStartX, coords.p1Y, rMidX, coords.p1Y, '#000000', 2);
                        drawLine(rStartX, coords.p2Y, rMidX, coords.p2Y, '#000000', 2);
                        drawLine(rMidX, coords.p1Y, rMidX, coords.p2Y, '#000000', 2);
                        drawLine(rMidX, coords.midY, rEndX, coords.midY, '#000000', 2);
                    });
                }

                // 4. 勝者ルート（赤太線、4.5px）の上書き描画
                let finalWinnerMatch = null;
                for (let r = 1; r <= totalRounds; r++) {
                    const rStartX = startX + (r - 1) * stepX;
                    const rMidX = rStartX + stepX * 0.55;
                    const rEndX = rStartX + stepX;

                    const matchesInRound = matches.filter(m => m.round === r);
                    matchesInRound.forEach(m => {
                        const coords = roundY[r][m.matchNum];
                        if (!coords) return;

                        if (r === 1) {
                            if (m.winnerId !== null) {
                                if (m.winnerId === m.p1Id) {
                                    drawLine(rStartX, coords.p1Y, rMidX, coords.p1Y, '#ff0000', 4.5);
                                    drawLine(rMidX, coords.p1Y, rMidX, coords.midY, '#ff0000', 4.5);
                                    drawLine(rMidX, coords.midY, rEndX, coords.midY, '#ff0000', 4.5);
                                } else if (m.winnerId === m.p2Id) {
                                    drawLine(rStartX, coords.p2Y, rMidX, coords.p2Y, '#ff0000', 4.5);
                                    drawLine(rMidX, coords.p2Y, rMidX, coords.midY, '#ff0000', 4.5);
                                    drawLine(rMidX, coords.midY, rEndX, coords.midY, '#ff0000', 4.5);
                                }
                            }
                        } else {
                            if (m.p1Id !== null) {
                                drawLine(rStartX, coords.p1Y, rMidX, coords.p1Y, '#ff0000', 4.5);
                            }
                            if (m.p2Id !== null) {
                                drawLine(rStartX, coords.p2Y, rMidX, coords.p2Y, '#ff0000', 4.5);
                            }

                            if (m.winnerId !== null) {
                                if (r === totalRounds && m.matchNum === 1) {
                                    finalWinnerMatch = m;
                                }

                                if (m.winnerId === m.p1Id) {
                                    drawLine(rMidX, coords.p1Y, rMidX, coords.midY, '#ff0000', 4.5);
                                    drawLine(rMidX, coords.midY, rEndX, coords.midY, '#ff0000', 4.5);
                                } else if (m.winnerId === m.p2Id) {
                                    drawLine(rMidX, coords.p2Y, rMidX, coords.midY, '#ff0000', 4.5);
                                    drawLine(rMidX, coords.midY, rEndX, coords.midY, '#ff0000', 4.5);
                                }
                            }
                        }
                    });
                }

                // 決勝勝者・トロフィーピカチュウ（グループAのみ）・優勝者名の描画
                if (finalWinnerMatch && roundY[totalRounds] && roundY[totalRounds][1]) {
                    const finalCoords = roundY[totalRounds][1];
                    const finalEndX = startX + totalRounds * stepX;
                    const goalLineEnd = finalEndX + 35;

                    // ゴール赤線
                    drawLine(finalEndX, finalCoords.midY, goalLineEnd, finalCoords.midY, '#ff0000', 4.5);

                    let textStartX = goalLineEnd + 15;
                    const pikachuSize = 90;
                    // トロフィーピカチュウはグループAのみ描画
                    if (isGroupA && trophyPikachuImg) {
                        ctx.drawImage(trophyPikachuImg, goalLineEnd + 10, finalCoords.midY - pikachuSize / 2, pikachuSize, pikachuSize);
                        textStartX = goalLineEnd + pikachuSize + 20;
                    }

                    // 優勝者名
                    const winnerName = finalWinnerMatch.winnerId === finalWinnerMatch.p1Id ? finalWinnerMatch.p1Name : finalWinnerMatch.p2Name;

                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#ea580c';
                    ctx.font = 'bold 14px "Noto Sans JP", sans-serif';
                    ctx.fillText('🏆 CHAMPION', textStartX, finalCoords.midY - 14);

                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 20px "Noto Sans JP", sans-serif';
                    ctx.fillText(winnerName + ' 選手', textStartX, finalCoords.midY + 14);
                }

                // 案C: フッター情報
                let footerText = 'ASOPokeTool 大会公式記録';
                if (venue && venue !== 'null' && venue.trim() !== '') footerText = '会場: ' + venue + '  |  ' + footerText;
                if (heldDate && heldDate !== 'null' && heldDate.trim() !== '') footerText = '開催日: ' + heldDate + '  |  ' + footerText;

                ctx.font = '500 12px "Noto Sans JP", sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.textAlign = 'right';
                ctx.fillText(footerText, canvas.width - 40, 685);

                // ダウンロード
                const link = document.createElement('a');
                link.download = filename + '_' + new Date().toISOString().slice(0, 10) + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }

            function captureAllBrackets() {
                const panes = document.querySelectorAll('.tab-pane');
                panes.forEach(pane => {
                    const target = pane.querySelector('.card-glass');
                    if (target && target.id) {
                        const tabId = 'tab-' + pane.id.replace('panel-', '');
                        const tabButton = document.getElementById(tabId);
                        const groupName = tabButton ? tabButton.innerText.trim() : '';
                        downloadScreenshot(target.id, 'tournament_bracket_' + (groupName || 'group'), groupName);
                    }
                });
            }

            let bracketP1EntryIdVal = null;
            let bracketP2EntryIdVal = null;

            function handleBracketClick(element) {
                if (!element.classList.contains('clickable')) {
                    return;
                }
                const matchId = element.getAttribute('data-match-id');
                const p1Id = element.getAttribute('data-p1-id');
                const p1Name = element.getAttribute('data-p1-name');
                const p2Id = element.getAttribute('data-p2-id');
                const p2Name = element.getAttribute('data-p2-name');
                const p1Icon = element.getAttribute('data-p1-icon');
                const p2Icon = element.getAttribute('data-p2-icon');

                document.getElementById('modalBracketMatchId').value = matchId;
                bracketP1EntryIdVal = p1Id;
                bracketP2EntryIdVal = p2Id;

                document.getElementById('bracketP1Name').innerText = p1Name;
                document.getElementById('bracketLabelP1Win').innerText = p1Name + " さんの勝ち";
                document.getElementById('bracketP1Icon').src = p1Icon && p1Icon.trim() !== '' ? p1Icon : '/asopoketool/images/pikachu.png';

                document.getElementById('bracketP2Name').innerText = p2Name;
                document.getElementById('bracketLabelP2Win').innerText = p2Name + " さんの勝ち";
                document.getElementById('bracketP2Icon').src = p2Icon && p2Icon.trim() !== '' ? p2Icon : '/asopoketool/images/pikachu.png';

                // Reset radios
                document.querySelectorAll('input[name="bracketResultOption"]').forEach(r => r.checked = false);

                const myModal = new bootstrap.Modal(document.getElementById('bracketResultModal'));
                myModal.show();
            }

            function selectBracketRadio(id) {
                const radio = document.getElementById(id);
                if (radio && !radio.disabled) {
                    radio.checked = true;
                }
            }

            function submitBracketResult() {
                const matchId = document.getElementById('modalBracketMatchId').value;
                const selectedOpt = document.querySelector('input[name="bracketResultOption"]:checked');

                if (!selectedOpt) {
                    alert("勝者を選択してください。");
                    return;
                }

                let winnerEntryId = null;
                if (selectedOpt.value === 'p1') {
                    winnerEntryId = bracketP1EntryIdVal;
                } else if (selectedOpt.value === 'p2') {
                    winnerEntryId = bracketP2EntryIdVal;
                }

                if (!confirm("決勝の対戦結果を登録します。一度登録すると変更できません。よろしいですか？")) {
                    return;
                }

                const metaElem = document.getElementById('tournamentBracketMeta');
                const tournamentId = metaElem ? metaElem.getAttribute('data-tournament-id') : '';
                if (!tournamentId || !matchId || !winnerEntryId) {
                    alert("登録情報が不足しているため送信できません。画面を再読み込みしてお試しください。");
                    return;
                }

                const url = '/asopoketool/tournament/' + tournamentId + '/bracket/match/' + matchId + '/ajax';

                const formData = new URLSearchParams();
                formData.append('winnerEntryId', winnerEntryId);

                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert("対戦結果を登録しました！");
                        window.location.reload();
                    } else {
                        alert("登録に失敗しました: " + (data.message || "不明なエラー"));
                    }
                })
                .catch(err => {
                    alert("通信エラーが発生しました。");
                    console.error(err);
                });
            }

            // トーナメント線 (SVGフォークコネクタ) の動的描画（母数4, 8, 16等に完全自動対応）
            function drawBracketConnectors() {
                document.querySelectorAll('.bracket-tree-container').forEach(container => {
                    let svg = container.querySelector('.bracket-tree-svg');
                    if (!svg) {
                        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.setAttribute('class', 'bracket-tree-svg');
                        container.insertBefore(svg, container.firstChild);
                    }
                    svg.innerHTML = '';

                    const containerRect = container.getBoundingClientRect();
                    if (containerRect.width === 0 || containerRect.height === 0) return;

                    // 有効なラウンド列を取得
                    const roundCols = Array.from(container.querySelectorAll('.bracket-round'));
                    if (roundCols.length < 1) return;

                    // 見出しタイトルの動的最適化 (母数4なら 準決勝 -> 決勝戦 など)
                    const totalRounds = roundCols.length;
                    roundCols.forEach((col, idx) => {
                        const heading = col.querySelector('.bracket-round-title');
                        if (!heading) return;
                        const roundFromEnd = totalRounds - idx;
                        if (roundFromEnd === 1) {
                            heading.innerHTML = '<i class="fa-solid fa-crown text-warning me-1"></i> 決勝戦';
                        } else if (roundFromEnd === 2) {
                            heading.innerText = '準決勝';
                        } else if (roundFromEnd === 3) {
                            heading.innerText = totalRounds === 3 ? '1回戦 (準々決勝)' : '準々決勝';
                        } else {
                            heading.innerText = (idx + 1) + '回戦';
                        }
                    });

                    if (roundCols.length < 2) return;

                    function getBoxCoords(box) {
                        const rect = box.getBoundingClientRect();
                        return {
                            left: rect.left - containerRect.left,
                            right: rect.right - containerRect.left,
                            top: rect.top - containerRect.top,
                            bottom: rect.bottom - containerRect.top,
                            centerY: (rect.top + rect.bottom) / 2 - containerRect.top,
                            winnerId: box.getAttribute('data-winner-id'),
                            p1Id: box.getAttribute('data-p1-id'),
                            p2Id: box.getAttribute('data-p2-id'),
                            matchNum: parseInt(box.getAttribute('data-match-num')),
                            isBye: box.getAttribute('data-is-bye') === 'true'
                        };
                    }

                    function addPath(d, isWinner) {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', d);
                        path.setAttribute('class', isWinner ? 'bracket-line-winner' : 'bracket-line-base');
                        svg.appendChild(path);
                    }

                    function connectMatches(boxAElement, boxBElement, targetBoxElement) {
                        if (!boxAElement || !boxBElement || !targetBoxElement) return;

                        const boxA = getBoxCoords(boxAElement);
                        const boxB = getBoxCoords(boxBElement);
                        const target = getBoxCoords(targetBoxElement);

                        const xA = boxA.right + 8;
                        const yA = boxA.centerY;
                        const xB = boxB.right + 8;
                        const yB = boxB.centerY;
                        const xTarget = target.left;
                        const yTarget = target.centerY;

                        const maxX = Math.max(xA, xB);
                        const midX = maxX + (xTarget - maxX) * 0.45;

                        // ベース線 (フォーク型)
                        addPath(`M ${xA} ${yA} H ${midX} V ${yTarget}`, false);
                        addPath(`M ${xB} ${yB} H ${midX} V ${yTarget}`, false);
                        addPath(`M ${midX} ${yTarget} H ${xTarget}`, false);

                        // 勝者ハイライト線
                        if (boxA.winnerId) {
                            addPath(`M ${xA} ${yA} H ${midX} V ${yTarget}`, true);
                            if (target.p1Id == boxA.winnerId || target.p2Id == boxA.winnerId) {
                                addPath(`M ${midX} ${yTarget} H ${xTarget}`, true);
                            }
                        }
                        if (boxB.winnerId) {
                            addPath(`M ${xB} ${yB} H ${midX} V ${yTarget}`, true);
                            if (target.p1Id == boxB.winnerId || target.p2Id == boxB.winnerId) {
                                addPath(`M ${midX} ${yTarget} H ${xTarget}`, true);
                            }
                        }
                    }

                    // ラウンド間の接続を動的ループ (Round 1 -> 2, 2 -> 3, ...)
                    for (let r = 0; r < roundCols.length - 1; r++) {
                        const currentRoundBoxes = Array.from(roundCols[r].querySelectorAll('.bracket-match-box'));
                        const nextRoundBoxes = Array.from(roundCols[r + 1].querySelectorAll('.bracket-match-box'));

                        nextRoundBoxes.forEach(targetBox => {
                            const targetMatchNum = parseInt(targetBox.getAttribute('data-match-num'));
                            const childMatchNum1 = (targetMatchNum - 1) * 2 + 1;
                            const childMatchNum2 = (targetMatchNum - 1) * 2 + 2;

                            const boxA = currentRoundBoxes.find(b => parseInt(b.getAttribute('data-match-num')) === childMatchNum1);
                            const boxB = currentRoundBoxes.find(b => parseInt(b.getAttribute('data-match-num')) === childMatchNum2);

                            if (boxA && boxB) {
                                connectMatches(boxA, boxB, targetBox);
                            }
                        });
                    }

                    // 最終ラウンド（決勝）の勝者ゴール線
                    const lastRoundCol = roundCols[roundCols.length - 1];
                    if (lastRoundCol) {
                        const finalBox = lastRoundCol.querySelector('.bracket-match-box');
                        if (finalBox) {
                            const finalCoords = getBoxCoords(finalBox);
                            if (finalCoords.winnerId) {
                                addPath(`M ${finalCoords.right + 8} ${finalCoords.centerY} H ${finalCoords.right + 35}`, true);
                            }
                        }
                    }
                });
            }

            // タブ状態の保持と復元 (リフレッシュ時も選択中のグループタブを維持)
            document.addEventListener('DOMContentLoaded', function () {
                const tournamentId = '[[${tournament.id}]]';
                const storageKey = 'activeBracketTab_' + tournamentId;

                const savedTabId = sessionStorage.getItem(storageKey);
                if (savedTabId) {
                    const targetTabBtn = document.getElementById(savedTabId);
                    if (targetTabBtn) {
                        const tabTrigger = bootstrap.Tab.getOrCreateInstance(targetTabBtn);
                        tabTrigger.show();
                    }
                }

                const tabElements = document.querySelectorAll('#bracketTab button[data-bs-toggle="tab"]');
                tabElements.forEach(tabBtn => {
                    tabBtn.addEventListener('shown.bs.tab', function (e) {
                        sessionStorage.setItem(storageKey, e.target.id);
                        setTimeout(drawBracketConnectors, 50);
                    });
                });

                // 初回描画とリサイズ対応
                setTimeout(drawBracketConnectors, 100);
                window.addEventListener('resize', drawBracketConnectors);
            });
        </script>


        <style>
            .bracket-match-box.clickable {
                cursor: pointer;
                border: 2px solid #FF6B35 !important;
                background: #FFF5F5 !important;
                box-shadow: 0 0 10px rgba(255, 107, 53, 0.25) !important;
                transition: transform 0.2s ease, border-color 0.2s ease;
            }
            .bracket-match-box.clickable:hover {
                transform: scale(1.03);
                border-color: #FF8E53 !important;
            }
        </style>

        <!-- Result Popup Modal for Bracket Match -->
        <div class="modal fade" id="bracketResultModal" tabindex="-1" aria-labelledby="bracketResultModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 20px; border: 3px solid #FFE4E1; background-color: #FFFDF0; color: #4A3E3D;">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold text-dark w-100 text-center" id="bracketResultModalLabel">決勝対戦結果の報告</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body py-4">
                        <form id="bracketResultForm">
                            <input type="hidden" id="modalBracketMatchId" name="matchId">
                            
                            <div class="d-flex justify-content-around align-items-center mb-4">
                                <!-- Player 1 Card -->
                                <div class="text-center p-3 rounded-3" style="width: 45%; background: rgba(255,107,53,0.05); border: 1px solid rgba(255,107,53,0.15);">
                                    <img id="bracketP1Icon" src="/asopoketool/images/pikachu.png" class="rounded-circle mb-2" style="width: 64px; height: 64px; object-fit: cover; border: 3px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                                    <div id="bracketP1Name" class="fw-bold text-truncate" style="color: #4A3E3D; font-size: 1.1rem;">-</div>
                                </div>
                                
                                <div class="fw-bold text-muted font-monospace fs-4">VS</div>
                                
                                <!-- Player 2 Card -->
                                <div class="text-center p-3 rounded-3" style="width: 45%; background: rgba(255,107,53,0.05); border: 1px solid rgba(255,107,53,0.15);">
                                    <img id="bracketP2Icon" src="/asopoketool/images/pikachu.png" class="rounded-circle mb-2" style="width: 64px; height: 64px; object-fit: cover; border: 3px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                                    <div id="bracketP2Name" class="fw-bold text-truncate" style="color: #4A3E3D; font-size: 1.1rem;">-</div>
                                </div>
                            </div>
                            
                            <div class="px-3">
                                <label class="form-label fw-bold mb-3 d-block text-center" style="color: #FF7F50; font-size: 1.1rem;">勝者を選択してください</label>
                                
                                <!-- Radio P1 Win -->
                                <div class="form-check p-3 mb-2 rounded-3 border align-items-center d-flex bg-white" style="cursor: pointer; transition: all 0.2s ease;" onclick="selectBracketRadio('bracketWinnerP1')">
                                    <input class="form-check-input ms-0 me-3" type="radio" name="bracketResultOption" id="bracketWinnerP1" value="p1">
                                    <label class="form-check-label fw-bold text-dark mb-0" for="bracketWinnerP1" id="bracketLabelP1Win" style="cursor: pointer;">- さんの勝ち</label>
                                </div>
                                
                                <!-- Radio P2 Win -->
                                <div class="form-check p-3 mb-4 rounded-3 border align-items-center d-flex bg-white" style="cursor: pointer; transition: all 0.2s ease;" onclick="selectBracketRadio('bracketWinnerP2')">
                                    <input class="form-check-input ms-0 me-3" type="radio" name="bracketResultOption" id="bracketWinnerP2" value="p2">
                                    <label class="form-check-label fw-bold text-dark mb-0" for="bracketWinnerP2" id="bracketLabelP2Win" style="cursor: pointer;">- さんの勝ち</label>
                                </div>
                                
                                <button type="button" class="btn btn-primary-custom w-100 py-3" onclick="submitBracketResult()" style="border-radius: 12px; font-weight: bold; font-size: 1.1rem;">
                                    <i class="fa-solid fa-circle-check"></i> 結果を登録する
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Guest Session Sync Script -->
        <th:block th:replace="~{layout/guest-session :: guestSessionSync}"></th:block>
    </div>
</body>
</html>
